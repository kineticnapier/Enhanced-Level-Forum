name: ELF v0.10 patch validation

on:
  push:
    paths:
      - 'scripts/apply-v010-patch.mjs'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dp-fingering-analyzer
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply v0.10 patch
        run: node scripts/apply-v010-patch.mjs
      - name: Install dependencies
        run: npm ci
      - name: Full test suite
        run: npm test
      - name: Commit validated changes
        run: |
          rm scripts/apply-v010-patch.mjs
          rm .github/workflows/elf-v010-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/analyzer/fingering-dp.mjs scripts/smoke-analyzer-lanes.mjs scripts/apply-v010-patch.mjs .github/workflows/elf-v010-patch.yml
          git commit -m "Model cross-hand chords and foot inputs"
          git push origin HEAD:feature/dp-fingering-analyzer
